name: "Terraform Destroy"
description: "Composite action to run Terraform destroy (with optional plan) for a given workspace or a set of workspaces derived from .tfvars files."

inputs:
  working-directory:
    description: "Directory to run Terraform in"
    required: true
  workspace:
    description: "Terraform workspace name (or base name for loop mode)"
    required: true
  var-file:
    description: "Path to .tfvars file (relative to working-directory) OR directory when loop-over-tfvars=true"
    required: false
  parallelism:
    description: "Parallelism for destroy (optional)"
    required: false
  loop-over-tfvars:
    description: "If true, loop over all .tfvars files in var-file directory and destroy each workspace"
    required: false
    default: "false"
  plan-only:
    description: "If true, just create a destroy plan without applying it"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Terraform Init
      shell: bash
      run: |
        set -euo pipefail
        cd '${{ inputs.working-directory }}'
        terraform init

    - name: Terraform Destroy (Single or Loop)
      shell: bash
      run: |
        set -euo pipefail
        cd '${{ inputs.working-directory }}'

        run_destroy() {
          local workspace_name="$1"
          local tfvars_file_path="$2"

          echo "==> Selecting workspace: $workspace_name"
          if terraform workspace select "$workspace_name" 2>/dev/null; then
            echo "Workspace $workspace_name selected"
          else
            echo "Workspace $workspace_name not found. Skipping destroy."
            return 0
          fi

          # Build destroy or plan -destroy command
          if [[ '${{ inputs.plan-only }}' == 'true' ]]; then
            local plan_cmd=("plan" "-destroy" "-refresh=true" "-input=false" "-out=destroy.tfplan")
            if [[ -n "$tfvars_file_path" ]]; then
              plan_cmd+=("-var-file" "$tfvars_file_path")
            fi
            echo "Running: terraform ${plan_cmd[*]}"
            terraform "${plan_cmd[@]}"
          else
            local destroy_cmd=("destroy" "-auto-approve" "-refresh=true" "-input=false")
            if [[ -n "${{ inputs.parallelism }}" ]]; then
              destroy_cmd+=("-parallelism=${{ inputs.parallelism }}")
            fi
            if [[ -n "$tfvars_file_path" ]]; then
              destroy_cmd+=("-var-file" "$tfvars_file_path")
            fi
            echo "Running: terraform ${destroy_cmd[*]}"
            terraform "${destroy_cmd[@]}"
          fi
        }

        if [[ '${{ inputs.loop-over-tfvars }}' == 'true' ]]; then
          echo "==> Looping over tfvars files in '${{ inputs.var-file }}'"
          for tfvars_file in "${{ inputs.var-file }}"/*.tfvars; do
            if [ -f "$tfvars_file" ]; then
              base_name=$(basename "$tfvars_file" .tfvars)
              loop_workspace_name="${{ inputs.workspace }}-${base_name}"
              run_destroy "$loop_workspace_name" "$tfvars_file"
            fi
          done
        else
          echo "==> Running single destroy for workspace '${{ inputs.workspace }}'"
          single_tfvars=""
          if [[ -n '${{ inputs.var-file }}' ]]; then
            if [[ -f '${{ inputs.var-file }}' ]]; then
              single_tfvars='${{ inputs.var-file }}'
            elif [[ -f "./${{ inputs.var-file }}" ]]; then
              single_tfvars="./${{ inputs.var-file }}"
            fi
          fi
          run_destroy "${{ inputs.workspace }}" "$single_tfvars"
        fi
